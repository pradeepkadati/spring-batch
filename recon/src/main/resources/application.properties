spring.application.name=recon

# Example for an H2 In-Memory database
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password

# Prevents all jobs from running automatically on startup
spring.batch.job.enabled=false

spring.main.allow-bean-definition-overriding=true

# --- S3 (NetApp StorageGRID) -> enrich -> SFTP pipeline ---
# All secrets here should come from env vars / a vault in real deployments, never hardcoded.
batch.s3sftp.s3.endpoint=https://storagegrid.example.internal
batch.s3sftp.s3.region=us-east-1
batch.s3sftp.s3.access-key=${NETAPP_S3_ACCESS_KEY:}
batch.s3sftp.s3.secret-key=${NETAPP_S3_SECRET_KEY:}
batch.s3sftp.s3.path-style-access=true
batch.s3sftp.s3.bucket=my-batch-bucket
batch.s3sftp.s3.inbound-prefix=inbound/
batch.s3sftp.s3.processed-prefix=processed/
batch.s3sftp.s3.failed-prefix=failed/

batch.s3sftp.sftp.host=sftp.partner.example.com
batch.s3sftp.sftp.port=22
batch.s3sftp.sftp.user=${SFTP_USER:}
batch.s3sftp.sftp.private-key-path=${SFTP_PRIVATE_KEY_PATH:}
batch.s3sftp.sftp.known-hosts-path=${SFTP_KNOWN_HOSTS_PATH:}
batch.s3sftp.sftp.remote-dir=/inbound/enriched
batch.s3sftp.sftp.strict-host-key-checking=true

batch.s3sftp.local.staging-dir=/var/tmp/s3sftp-staging
batch.s3sftp.local.keep-files-on-failure=true

batch.s3sftp.retry.max-attempts=4
batch.s3sftp.retry.chunk-size=100
batch.s3sftp.retry.skip-limit=20
batch.s3sftp.retry.process-retry-limit=3

# Poller is off by default - enable once endpoint/credentials are set, or drive the job from
# an S3 event notification instead.
batch.s3sftp.poller.enabled=false
batch.s3sftp.poller.fixed-delay-millis=60000
